---
layout: default
---
<article class="post">

  <header class="head-wrapper">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {% if page.description %} 
    <p class="page-description"> {{ page.description }}</p>
    {% endif %}
  </header>

  <div class="content-wrapper">
  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>
  </div>

</article>
